name: Clipline worker

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch: {}      # "Run now" in the app, or Actions tab -> Run workflow
  push:
    branches: [main]
    paths: ["site/**", "scripts/**"]   # app changes redeploy without running the worker

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: clipline-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install ffmpeg + fonts
        if: github.event_name != 'push'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python deps
        if: github.event_name != 'push'
        run: pip install -q -r worker/requirements.txt

      - name: Cache Whisper model
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Run worker
        if: github.event_name != 'push'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python worker/clipline.py

      - name: Save queue
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "clipline-bot"
          git config user.email "clipline-bot@users.noreply.github.com"
          git add data/queue.json
          if git diff --cached --quiet; then echo "no queue changes"; exit 0; fi
          git commit -m "worker: update clip queue"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done

      - name: Build review app
        if: always()
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: git pull -q --rebase || true; python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: dist

      - name: Publish to GitHub Pages
        id: deploy
        if: always()
        uses: actions/deploy-pages@v4
